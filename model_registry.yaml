# Model routing configuration
routing:
  # Default models for different modalities (GPU-optimized)
  default_rgb_model: "rgb_yolov8n_gpu"  # Use GPU-optimized PyTorch for best performance
  default_thermal_model: "rgb_yolov8n_gpu"  # Reuse RGB model for thermal
  default_rgb_t_model: "rgb_yolov8n_gpu"  # Use for RGB-T fusion
  
  # Performance-based routing
  performance_routing:
    ultra_fast: "rgb_yolov8n_gpu"      # Fastest model on GPU (87.2 FPS)
    fast: "rgb_yolo11n_gpu"           # Latest generation, very fast (60.2 FPS)
    balanced: "rgb_yolo11s_gpu"       # Good balance of speed and accuracy (64.5 FPS)
    high_accuracy: "rgb_yolov9t_gpu"  # Higher accuracy, still fast (38.1 FPS)
  
  # GPU-specific routing
  gpu_routing:
    # Best models for RTX 3070 GPU
    rtx_3070_ultra_fast: "rgb_yolov8n_gpu"    # 11.5ms, 87.2 FPS
    rtx_3070_balanced: "rgb_yolo11n_gpu"      # 16.6ms, 60.2 FPS
    rtx_3070_accuracy: "rgb_yolo11s_gpu"     # 15.5ms, 64.5 FPS
  
  # Camera-specific routing (optional)
  camera_routing:
    # Example: Use different models for different camera types
    # "camera_001": "rgb_yolov8n_gpu"  # Entry camera - fastest
    # "camera_002": "rgb_yolo11n_gpu"  # Main area - balanced
    # "camera_003": "rgb_yolo11s_gpu"  # Critical area - higher accuracy

# Performance optimization settings
optimization:
  # ONNX Runtime settings
  onnx:
    execution_providers: ["CUDAExecutionProvider", "CPUExecutionProvider"]
    graph_optimization_level: "ORT_ENABLE_ALL"
    execution_mode: "ORT_SEQUENTIAL"
    
  # Batch processing
  batch_processing:
    enabled: false  # Set to true for batch processing (higher latency, better throughput)
    batch_size: 4
    
  # Memory optimization
  memory:
    max_workspace_size: 4  # GB
    enable_memory_mapping: true
    
  # Threading
  threading:
    intra_op_num_threads: 0  # 0 = auto
    inter_op_num_threads: 0  # 0 = auto
