    classes:
      - person
      - car
      - bicycle
      - motorcycle
    preprocessing:
      normalize: true
      resize: true
      pad: true
      illumination_aware_gate: true
    postprocessing:
      confidence_threshold: 0.35
      nms_threshold: 0.45
      max_detections: 500

# Model routing configuration with ultra-low latency preference
routing:
  default_rgb_model: "rgb_yolov8n_ultra_low_latency"  # Use ultra-low latency model by default
  default_thermal_model: "thermal_yolov8n"
  default_fusion_model: "rgb_t_fusion"
  
  # Ultra-low latency routing for RTX 3070
  gpu_routing:
    rtx_3070_ultra_low_latency: "rgb_yolov8n_ultra_low_latency"  # <15ms target
    rtx_3070_primary: "rgb_yolov8n_gpu"  # Fallback optimized
  
  # Camera-specific model assignments (optional)
  camera_models: {}
    # camera_id: model_name
    # Example:
    # "camera_001": "rgb_yolov8n_ultra_low_latency"  # Entry camera - ultra-fast
    # "camera_002": "rgb_yolov8n_ultra_low_latency"  # Main area - ultra-fast

# ═══════════════════════════════════════════════════════════
# Multi-Object Tracking (MOT) Configuration
# ═══════════════════════════════════════════════════════════
tracking:
  # Default tracker: 'botsort' (StrongSORT-class with Re-ID) or 'bytetrack' (fast, motion-only)
  default_tracker: "botsort"
  
  # Path to tracker config file (relative to ai-engine/)
  config_file: "botsort.yaml"
  
  # Per-camera tracker override (optional)
  # Useful for dense/crowded scenes (use botsort) vs simple scenes (use bytetrack)
  camera_trackers: {}
    # "camera_001": "botsort"     # Crowded area - use Re-ID
    # "camera_002": "bytetrack"   # Simple hallway - use motion-only

# Performance settings
performance:
  batch_size: 1
  max_batch_size: 8
  inference_timeout_ms: 100
  gpu_memory_fraction: 0.8
  
# Model warmup
warmup:
  enabled: true
  iterations: 3
  input_shape: [1, 3, 640, 640]
