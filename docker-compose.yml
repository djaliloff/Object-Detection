services:
  # ─── Foundation ───────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: surveillance-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: surveillance-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  go2rtc:
    image: alexxit/go2rtc
    container_name: surveillance-go2rtc
    ports:
      - "1984:1984"   # API/UI
      - "8555:8555"   # WebRTC
      - "8554:8554"   # RTSP
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml

  # ─── Application Microservices ────────────────────────────────────
  camera-gateway:
    build: ./camera-gateway
    container_name: camera-gateway
    depends_on:
      - redis
      - go2rtc
    environment:
      - REDIS_URL=${REDIS_URL}
      - GO2RTC_URL=${GO2RTC_URL}
    volumes:
      - ./data/frames:/data/frames

  ai-engine:
    build: ./ai-engine
    container_name: ai-engine
    depends_on:
      - redis
    environment:
      - REDIS_URL=${REDIS_URL}
      - AI_BACKEND=${AI_BACKEND}
    volumes:
      - ./models:/models

  event-processor:
    build: ./event-processor
    container_name: event-processor
    depends_on:
      - redis
      - backend-api
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}

  backend-api:
    build: ./backend-api
    container_name: backend-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}

  frontend:
    build: ./frontend
    container_name: surveillance-frontend
    ports:
      - "80:80"
    depends_on:
      - backend-api

volumes:
  db-data:
